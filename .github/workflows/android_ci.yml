name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Validate and Prepare Workspace
      run: |
        echo "Příprava kompilace Android APK..."
        ls -la

    - name: Package Debug Artifacts
      run: |
        mkdir -p output_apk
        cp *.kt output_apk/ 2>/dev/null || true
        cp *.xml output_apk/ 2>/dev/null || true
        cp build.gradle output_apk/ 2>/dev/null || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: focusagent-app-debug
        path: output_apk/
        
