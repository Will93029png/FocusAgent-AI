name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Code Structure
      run: |
        echo "Kontrola souborů projektu..."
        ls -la

    - name: Bundle Project Source Code
      run: |
        mkdir -p package_output
        cp *.kt package_output/ 2>/dev/null || true
        cp *.xml package_output/ 2>/dev/null || true
        cp *.md package_output/ 2>/dev/null || true

    - name: Upload Application Artifact
      uses: actions/upload-artifact@v4
      with:
        name: focusagent-app-debug
        path: package_output/
        
