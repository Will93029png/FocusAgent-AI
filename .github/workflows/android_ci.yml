name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradlew nenalezen, balím soubory projektu..."
        fi

    - name: Prepare Artifact
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \; 2>/dev/null || true
        if [ -z "$(ls -A output_apk)" ]; then
          cp -r . output_apk/
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: focusagent-app-build
        path: output_apk/
        
